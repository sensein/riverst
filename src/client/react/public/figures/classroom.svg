<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Classroom interior">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf1f8"/>
      <stop offset="1" stop-color="#dce8f3"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4c79c"/>
      <stop offset="1" stop-color="#d2ad7f"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdeafe"/>
      <stop offset="1" stop-color="#eaf7ff"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7e0"/>
      <stop offset="1" stop-color="#fff7e0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- wall -->
  <rect x="0" y="0" width="1600" height="640" fill="url(#wall)"/>
  <!-- floor -->
  <rect x="0" y="620" width="1600" height="280" fill="url(#floor)"/>
  <!-- baseboard -->
  <rect x="0" y="612" width="1600" height="16" fill="#cdd9e6"/>
  <!-- floor planks -->
  <g stroke="#c49b6c" stroke-width="2" opacity="0.5">
    <line x1="0" y1="690" x2="1600" y2="690"/>
    <line x1="0" y1="770" x2="1600" y2="770"/>
    <line x1="0" y1="850" x2="1600" y2="850"/>
  </g>

  <!-- window (left) -->
  <g transform="translate(-80,-60)">
    <rect x="95" y="120" width="360" height="330" rx="8" fill="#ffffff"/>
    <rect x="110" y="135" width="330" height="300" rx="4" fill="url(#sky)"/>
    <circle cx="360" cy="215" r="110" fill="url(#sun)"/>
    <circle cx="360" cy="215" r="34" fill="#ffe08a"/>
    <!-- simple clouds -->
    <g fill="#ffffff" opacity="0.9">
      <ellipse cx="200" cy="200" rx="40" ry="18"/>
      <ellipse cx="235" cy="195" rx="30" ry="15"/>
      <ellipse cx="180" cy="320" rx="34" ry="15"/>
    </g>
    <!-- mullions -->
    <rect x="270" y="135" width="10" height="300" fill="#ffffff"/>
    <rect x="110" y="275" width="330" height="10" fill="#ffffff"/>
    <rect x="95" y="120" width="360" height="330" rx="8" fill="none" stroke="#dfe7ef" stroke-width="6"/>
  </g>

  <!-- bunting / pennants across the top -->
  <g>
    <path d="M520 70 Q 900 150 1500 60" fill="none" stroke="#b9c6d6" stroke-width="3"/>
    <g>
      <polygon points="560,86 600,86 580,126" fill="#ff8fab"/>
      <polygon points="640,94 680,94 660,134" fill="#ffd166"/>
      <polygon points="720,100 760,100 740,140" fill="#8ecae6"/>
      <polygon points="800,104 840,104 820,144" fill="#a7e3a0"/>
      <polygon points="880,104 920,104 900,144" fill="#ff8fab"/>
      <polygon points="960,102 1000,102 980,142" fill="#ffd166"/>
      <polygon points="1040,98 1080,98 1060,138" fill="#8ecae6"/>
      <polygon points="1120,92 1160,92 1140,132" fill="#a7e3a0"/>
      <polygon points="1200,84 1240,84 1220,124" fill="#ff8fab"/>
      <polygon points="1280,76 1320,76 1300,116" fill="#ffd166"/>
    </g>
  </g>

  <!-- bookshelf (now on the left) -->
  <g transform="translate(-1230,0)">
    <rect x="1300" y="360" width="230" height="252" rx="6" fill="#c89b6a"/>
    <rect x="1300" y="360" width="230" height="252" rx="6" fill="none" stroke="#a97e4f" stroke-width="4"/>
    <rect x="1312" y="452" width="206" height="8" fill="#a97e4f"/>
    <rect x="1312" y="536" width="206" height="8" fill="#a97e4f"/>
    <g>
      <rect x="1320" y="378" width="18" height="70" fill="#ef6f6c"/>
      <rect x="1342" y="372" width="18" height="76" fill="#60a5fa"/>
      <rect x="1364" y="382" width="18" height="66" fill="#f4b740"/>
      <rect x="1386" y="376" width="18" height="72" fill="#34d399"/>
      <rect x="1420" y="380" width="60" height="68" fill="#bb8bd0" rx="3"/>
      <rect x="1320" y="470" width="18" height="60" fill="#60a5fa"/>
      <rect x="1342" y="466" width="18" height="64" fill="#34d399"/>
      <rect x="1364" y="472" width="18" height="58" fill="#ef6f6c"/>
      <rect x="1386" y="468" width="18" height="62" fill="#f4b740"/>
    </g>
  </g>

  <!-- potted plant (now bottom left, beside the bookshelf) -->
  <g transform="translate(-900,0)">
    <path d="M1230 612 q -40 -120 10 -180 q 30 60 -10 180 z" fill="#5fae6a"/>
    <path d="M1230 612 q 40 -130 -6 -196 q -34 66 6 196 z" fill="#4e9c5a"/>
    <path d="M1230 612 q 70 -80 70 -150 q -58 40 -70 150 z" fill="#6cc078"/>
    <path d="M1206 612 h 60 l -8 70 h -44 z" fill="#d98157"/>
  </g>

  <!-- soft floor shadow where the avatar stands -->
  <ellipse cx="560" cy="760" rx="300" ry="42" fill="#b48c5e" opacity="0.28"/>
</svg>
